<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SORARY — Preview</title>
<meta name="description" content="SORARY is a marketplace for original contemporary art. Free for artists to sell, with buyer protection for collectors. Opening soon in Stockholm.">
<link rel="canonical" href="https://sorary.se/preview/">
<meta property="og:type" content="website"><meta property="og:url" content="https://sorary.se/"><meta property="og:title" content="SORARY — Original contemporary art">
<meta property="og:description" content="Collect the artists of now. Free for artists to sell, with buyer protection for collectors.">
<meta property="og:image" content="https://sorary.se/art/sorary-390834.webp"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=DM+Mono:wght@300;400&display=swap">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}/* SORARY — gallery-white platform. Layout: generous margins, left-aligned editorial columns, 12-col grid on desktop. */
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#777777; --line:#EAEAEA; --surface:#F8F8F6; --hover:#F4F4F2;
  --danger:#8A2B2B; --sold:#A3352A; --ok:#3F5A45;
  --sans:"Jost","Avenir Next","Avenir","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.6,.2,1);
  --max:1320px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
h1,h2,h3,h4{font-weight:300;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
::selection{background:#111;color:#fff}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:clamp(0px,3vw,40px)}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Logo */
.logo{display:inline-flex;align-items:center;color:var(--fg)}
.logo svg{height:13px;width:auto;fill:currentColor;display:block}
.logo.lg svg{height:22px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--fg);color:#fff;
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;padding:17px 30px;min-height:52px;
  border:1px solid var(--fg);border-radius:0;transition:background .3s var(--ease),color .3s var(--ease);white-space:nowrap}
.btn:hover{background:#2c2c2c}
.btn.o{background:transparent;color:var(--fg)}
.btn.o:hover{background:var(--hover)}
.btn.sm{padding:11px 18px;min-height:40px;font-size:10px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.link{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:400;border-bottom:1px solid currentColor;padding-bottom:3px;transition:opacity .3s}
.link:hover{opacity:.55}
.textbtn{font-size:13px;color:var(--muted);transition:color .2s}
.textbtn:hover{color:var(--fg)}
.danger-t{color:var(--danger)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:400}
.in{font:inherit;font-weight:300;font-size:17px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:10px 0 11px;border-radius:0;width:100%;transition:border-color .3s;outline:none}
.in:focus{border-color:var(--fg)}
.in::placeholder{color:#b5b5b5}
textarea.in{border:1px solid var(--line);padding:12px 14px;font-size:15px;line-height:1.6;resize:vertical;min-height:110px}
textarea.in:focus{border-color:var(--fg)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--danger)}
.okt{font-size:12.5px;color:var(--ok)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{appearance:none;width:15px;height:15px;border:1px solid #bdbdbd;margin:0;display:grid;place-content:center;cursor:pointer}
.check input:checked{background:var(--fg);border-color:var(--fg)}
.check input:checked::after{content:"";width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;padding:9px 14px;color:var(--muted);font-weight:400}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:#fff}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* Header */
.ph{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.ph .in-h{max-width:var(--max);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.ph .in-h{padding-inline:calc(max(16px,env(safe-area-inset-left,0px)) + clamp(0px,3vw,40px))}}
.pnav{display:flex;gap:36px;align-items:center}
.pnav a{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:400;color:#555;transition:color .25s;position:relative}
.pnav a:hover,.pnav a[aria-current="page"]{color:var(--fg)}
.pnav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:.24em;bottom:-6px;height:1px;background:var(--fg)}
.menu-btn{display:none;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:400}
.mmenu{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(20px,env(safe-area-inset-left,0px))}
.mmenu .top{display:flex;justify-content:space-between;align-items:center}
.mmenu nav{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.mmenu nav a{font-size:40px;font-weight:300;letter-spacing:-.01em;line-height:1.25}
.mmenu .foot{margin-top:40px}
@media (max-width:820px){.pnav{display:none}.menu-btn{display:block}}

/* Landing */
.hero{padding-block:clamp(72px,12vw,168px) clamp(72px,9vw,128px)}
.hero-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:end}
.hero h1{grid-column:1/-1;font-size:clamp(44px,7.4vw,112px);line-height:.98;letter-spacing:-.025em;font-weight:300;max-width:12ch}
.hero .sub{grid-column:1/7;font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:#444;max-width:44ch;margin-top:clamp(32px,4vw,56px)}
.hero-form{grid-column:1/8;margin-top:clamp(40px,5vw,72px);display:grid;grid-template-columns:1fr 1fr;gap:28px 32px}
.hero-form .actions{grid-column:1/-1;display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-top:6px}
.wall{grid-column:9/13;align-self:end;border-left:1px solid var(--line);padding-left:28px;font-size:14px;line-height:1.7}
.wall .u{font-size:15px;color:var(--fg);word-break:break-all}
.wall .u b{font-weight:400}
.wall .m{color:var(--muted)}
.wall .eyebrow{display:block;margin-bottom:14px}
@media (max-width:900px){
  .hero .sub,.hero-form{grid-column:1/-1}
  .wall{grid-column:1/-1;margin-top:8px}
}
@media (max-width:560px){.hero-form{grid-template-columns:1fr}.hero-form .btn{width:100%}}

.sec{padding-block:clamp(72px,10vw,150px)}
.sec-h{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;margin-bottom:clamp(40px,6vw,80px)}
.sec-h h2{grid-column:1/8;font-size:clamp(30px,3.6vw,52px);line-height:1.08;letter-spacing:-.015em}
.sec-h p{grid-column:9/13;align-self:end;color:var(--muted);font-size:16px;max-width:34ch}
@media (max-width:820px){.sec-h h2,.sec-h p{grid-column:1/-1}}

.show{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,4vw,64px) clamp(20px,3vw,48px)}
.show .item{display:flex;flex-direction:column;gap:18px;min-width:0}
.show .item:nth-child(even){margin-top:clamp(0px,8vw,120px)}
.frame{border:1px solid var(--line);background:var(--bg);overflow:hidden;position:relative}
.frame .bar{height:30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.frame .vp{position:relative;overflow:hidden;aspect-ratio:4/3.1}
.frame .vp .scaler{position:absolute;top:0;left:0;width:1280px;transform-origin:0 0;pointer-events:none}
.show .item a.frame{display:block;transition:border-color .5s var(--ease)}
.show .item a.frame:hover{border-color:#cfcfcf}
.show .item a.frame .scaler{transition:transform 1.2s var(--ease)}
.tomb{font-size:14px;line-height:1.55}
.tomb .t{font-weight:400}
.tomb .m{color:var(--muted)}
@media (max-width:700px){.show{grid-template-columns:1fr}.show .item:nth-child(even){margin-top:0}}

.ben{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,64px)}
.ben>div{border-top:1px solid var(--fg);padding-top:24px}
.ben h3{font-size:22px;letter-spacing:-.005em;margin-bottom:14px;font-weight:400}
.ben p{color:#555;max-width:32ch}
@media (max-width:820px){.ben{grid-template-columns:1fr}}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.steps>div{padding:36px 32px 8px 0;border-right:1px solid var(--line);min-width:0}
.steps>div+div{padding-left:32px}
.steps>div:last-child{border-right:0}
.steps .n{font-size:clamp(56px,7vw,104px);font-weight:200;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.steps h3{font-size:20px;font-weight:400;margin:28px 0 10px}
.steps p{color:#555;max-width:30ch}
@media (max-width:820px){.steps{grid-template-columns:1fr}.steps>div,.steps>div+div{padding:28px 0;border-right:0;border-bottom:1px solid var(--line)}}

.cta{padding-block:clamp(96px,14vw,200px);border-top:1px solid var(--line)}
.cta h2{font-size:clamp(40px,6.5vw,96px);line-height:1;letter-spacing:-.025em;max-width:13ch;margin-bottom:48px}

.pf{border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.pf .in-f{max-width:var(--max);margin:0 auto;padding-block:48px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap}
@media (min-width:900px){.pf .in-f{padding-inline:calc(max(16px,env(safe-area-inset-left,0px)) + clamp(0px,3vw,40px))}}
.pf nav{display:flex;gap:12px 28px;flex-wrap:wrap}
.pf nav a{font-size:12.5px;color:#555}
.pf nav a:hover{color:var(--fg)}
.pf .c{font-size:12px;color:var(--muted);width:100%}

/* Generic content pages */
.page{padding-block:clamp(56px,9vw,128px)}
.page h1{font-size:clamp(40px,6vw,84px);line-height:1;letter-spacing:-.02em;margin-bottom:32px;max-width:14ch}
.prose{max-width:62ch;font-size:17px;color:#333}
.prose p+p{margin-top:1.1em}
.prose h2{font-size:22px;font-weight:400;margin:2em 0 .6em;color:var(--fg)}
.draft-note{display:inline-block;border:1px solid var(--line);padding:8px 14px;font-size:12.5px;color:var(--muted);margin-bottom:40px}

.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--fg);margin-top:56px}
.plans>div{padding:32px 32px 40px 0;display:flex;flex-direction:column;gap:20px;min-width:0}
.plans>div+div{padding-left:32px;border-left:1px solid var(--line)}
.plans .price{font-size:52px;font-weight:200;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.plans .price small{font-size:13px;color:var(--muted);letter-spacing:0;margin-left:6px}
.plans ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:15px;color:#444}
.plans li{padding-left:18px;position:relative}
.plans li::before{content:"";position:absolute;left:0;top:.8em;width:8px;height:1px;background:var(--fg)}
.plans .btn{margin-top:auto;align-self:flex-start}
@media (max-width:900px){.plans{grid-template-columns:1fr}.plans>div,.plans>div+div{padding:32px 0;border-left:0;border-bottom:1px solid var(--line)}}

.notice{border:1px solid var(--line);background:var(--surface);padding:16px 20px;font-size:14px;color:#555;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.notice b{font-weight:400;color:var(--fg)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,12px);background:var(--fg);color:#fff;
  font-size:13px;padding:13px 20px;z-index:200;opacity:0;transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Overlay / modal */
.ov{position:fixed;inset:0;z-index:150;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));animation:fade .35s var(--ease)}
.ov.dark{background:rgba(10,10,10,.97);color:#eee}
.modal{background:var(--bg);border:1px solid var(--line);width:min(560px,100%);max-height:100%;overflow:auto;padding:clamp(24px,4vw,44px);position:relative}
.modal h3{font-size:26px;margin-bottom:8px}
.xbtn{position:absolute;top:16px;right:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.xbtn:hover{color:var(--fg)}
.lb img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain}
.lb .lb-cap{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-size:13px;color:#aaa}
.lb .lb-n{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#aaa;padding:20px}
.lb .lb-n:hover{color:#fff}
.lb .prev{left:max(4px,env(safe-area-inset-left,0px))}.lb .next{right:max(4px,env(safe-area-inset-right,0px))}
.lb .xbtn{top:calc(env(safe-area-inset-top,0px) + 18px);right:max(20px,env(safe-area-inset-right,0px));color:#aaa}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s var(--ease) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}

/* Onboarding */
.ob-h{display:flex;justify-content:space-between;align-items:center;padding-block:24px;gap:16px;max-width:var(--max);margin:0 auto}
.prog{height:1px;background:var(--line);position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);transition:width .6s var(--ease)}
.ob{max-width:760px;margin:0 auto;padding-block:clamp(48px,8vw,96px) 120px}
.ob.wide{max-width:1120px}
.ob h1{font-size:clamp(34px,4.6vw,58px);line-height:1.04;letter-spacing:-.02em;margin:18px 0 16px}
.ob .lead{color:#555;font-size:17px;max-width:52ch;margin-bottom:48px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 32px}
.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.ob-nav{display:flex;justify-content:space-between;align-items:center;margin-top:56px;padding-top:28px;border-top:1px solid var(--line);gap:16px;flex-wrap:wrap}
.slugrow{display:flex;align-items:baseline;border-bottom:1px solid var(--line)}
.slugrow:focus-within{border-color:var(--fg)}
.slugrow span{font-size:17px;color:var(--muted)}
.slugrow .in{border:0;padding-left:2px}
.signed{display:flex;gap:14px;align-items:center;font-size:14px;color:#555;border:1px solid var(--line);padding:14px 16px;margin-bottom:36px}
.signed img{width:28px;height:28px;border-radius:50%}

.drop{border:1px solid var(--line);background:var(--surface);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  padding:40px 24px;transition:background .3s,border-color .3s;cursor:pointer}
.drop.over{background:var(--hover);border-color:var(--fg)}
.drop .big{font-size:22px;font-weight:300}
.uplist{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.uprow{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px solid var(--line);padding:8px 0}
.uprow .bar2{flex:0 0 120px;height:1px;background:var(--line);align-self:center;position:relative}
.uprow .bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);transition:width .4s}

.awl{display:flex;flex-direction:column;margin-top:40px;border-top:1px solid var(--line)}
.aw{display:grid;grid-template-columns:28px 120px minmax(0,1fr);gap:24px;padding:24px 0;border-bottom:1px solid var(--line);align-items:start}
.aw.dragging{opacity:.4}
.aw .handle{display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--muted);font-size:12px;padding-top:4px}
.aw .handle button{font-size:13px;color:var(--muted);width:24px;height:24px}
.aw .handle button:hover{color:var(--fg)}
.aw .handle .grip{cursor:grab;letter-spacing:-2px}
.aw .th{background:var(--surface);aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.aw .th img{max-height:100%;object-fit:contain}
.aw .f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 20px}
.aw .f .w2{grid-column:span 2}.aw .f .w4{grid-column:1/-1}
.aw .in{font-size:15px;padding:6px 0 7px}
.aw textarea.in{min-height:72px;font-size:14px}
@media (max-width:760px){.aw{grid-template-columns:1fr;gap:14px}.aw .handle{flex-direction:row}.aw .th{max-width:160px}.aw .f{grid-template-columns:1fr 1fr}.aw .f .w2{grid-column:1/-1}}

.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.tpl{display:flex;flex-direction:column;gap:14px;text-align:left}
.tpl .frame{transition:border-color .3s}
.tpl[aria-pressed="true"] .frame{border-color:var(--fg);outline:1px solid var(--fg)}
.tpl .frame .vp{aspect-ratio:3/4}
.tpl .nm{display:flex;justify-content:space-between;align-items:baseline}
.tpl .nm b{font-weight:400;font-size:17px}
@media (max-width:820px){.tpls{grid-template-columns:1fr}.tpl .frame .vp{aspect-ratio:4/3}}

/* Preview frame (onboarding step 5 + editor) */
.pvbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
.pvstage{background:var(--surface);border:1px solid var(--line);padding:clamp(12px,2vw,28px);display:flex;justify-content:center;min-width:0}
.pvdev{background:var(--bg);width:100%;max-width:100%;transition:max-width .5s var(--ease);height:72vh;overflow:auto;position:relative;border:1px solid var(--line)}
.pvdev.mobile{max-width:390px}
.pvtag{position:sticky;top:0;z-index:5;background:var(--fg);color:#fff;font-size:10px;letter-spacing:.24em;text-transform:uppercase;text-align:center;padding:6px}

/* Studio (dashboard) */
.st{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.side{border-right:1px solid var(--line);padding:28px 24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:40px;
  padding-left:max(24px,env(safe-area-inset-left,0px))}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;justify-content:space-between;font-size:14px;padding:8px 10px;margin-inline:-10px;color:#555;transition:background .2s,color .2s}
.side nav a:hover{background:var(--hover);color:var(--fg)}
.side nav a[aria-current="page"]{color:var(--fg);background:var(--surface)}
.side nav a .c{font-size:11px;color:var(--fg);background:var(--line);padding:0 7px;line-height:20px;font-variant-numeric:tabular-nums}
.side .bot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.main{padding:40px clamp(20px,4vw,56px) 96px;min-width:0;padding-right:max(clamp(20px,4vw,56px),env(safe-area-inset-right,0px))}
.main h1{font-size:clamp(30px,3.4vw,44px);letter-spacing:-.015em;line-height:1.08}
.mh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.mh .eyebrow{display:block;margin-bottom:12px}
.stab{display:none}
@media (max-width:900px){
  .st{grid-template-columns:1fr}
  .side{display:none}
  .stab{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
    overflow-x:auto;gap:22px;padding:16px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));align-items:center}
  .stab a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;color:var(--muted);font-weight:400}
  .stab a[aria-current="page"]{color:var(--fg)}
  .main{padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpis>div{padding:24px 24px 26px 0;min-width:0}
.kpis>div+div{padding-left:24px;border-left:1px solid var(--line)}
.kpis .v{font-size:clamp(30px,3.4vw,46px);font-weight:200;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:10px;overflow-wrap:anywhere}
.kpis .v.s{font-size:20px;font-weight:300;letter-spacing:0;line-height:1.4}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.kpis>div:nth-child(3){padding-left:0;border-left:0}.kpis>div:nth-child(n+3){border-top:1px solid var(--line)}}
.cols2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);margin-top:48px}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
.blk h2{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:400;margin-bottom:18px}
.list{border-top:1px solid var(--line)}
.list>a,.list>div{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14.5px;align-items:baseline}
.list>a:hover{background:var(--surface)}
.list .sm{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line);padding:4px 10px;font-weight:400;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.pill.live i{background:var(--ok)}
.pill.draft i{background:#c2a14a}
.urlbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px}
.urlbox code{font-family:var(--mono);font-size:13px;background:var(--surface);padding:7px 10px;border:1px solid var(--line);overflow-wrap:anywhere}
.empty{border:1px solid var(--line);padding:clamp(32px,6vw,72px) 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;color:#555}
.empty h3{font-size:24px;color:var(--fg)}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:28px 22px}
.wcard{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.wcard .th{background:var(--surface);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}
.wcard .th img{max-height:100%;object-fit:contain;transition:transform .8s var(--ease)}
.wcard .th:hover img{transform:scale(1.02)}
.wcard .th .badge{position:absolute;top:8px;left:8px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;background:var(--bg);padding:3px 7px}
.wcard .meta{font-size:13.5px;line-height:1.45;display:flex;justify-content:space-between;gap:8px}
.wcard .meta .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .acts{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.wcard .acts button:hover{color:var(--fg)}
.wcard.dragging{opacity:.35}
.wcard.dropt .th{outline:1px solid var(--fg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sold);vertical-align:middle}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:120;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 28px) max(28px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) 28px;animation:slide .45s var(--ease)}
.scrim{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:110}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

.ed{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
.edp{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.edp details{border-bottom:1px solid var(--line)}
.edp summary{list-style:none;cursor:pointer;padding:16px 0;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:400}
.edp summary::-webkit-details-marker{display:none}
.edp summary::after{content:"+";color:var(--muted);letter-spacing:0;font-size:15px;line-height:1}
.edp details[open] summary::after{content:"–"}
.edp .bd{padding:2px 0 24px;display:flex;flex-direction:column;gap:20px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);padding:12px 10px;font-size:12.5px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .2s}
.opt:hover{border-color:#bbb}
.opt[aria-pressed="true"]{border-color:var(--fg)}
.opt .sw{height:26px;border:1px solid var(--line)}
.opt .ty{font-size:20px;line-height:1}
.order{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.order>div{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.order button{font-size:13px;color:var(--muted);width:26px;height:26px}
.order button:hover{color:var(--fg)}
.order button[disabled]{opacity:.25}
.ent{display:grid;grid-template-columns:70px minmax(0,1fr) 22px;gap:10px;align-items:end;padding:6px 0}
.ent .in{font-size:14px;padding:5px 0}
.ent button{color:var(--muted);font-size:14px;padding-bottom:6px}
.edbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.save-state{font-size:12.5px;color:var(--muted)}
@media (max-width:1100px){.ed{grid-template-columns:1fr}.ed .pvdev{height:80vh}}

.bars{display:flex;flex-direction:column;gap:14px}
.bars .r{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:14px;align-items:center;font-size:13.5px}
.bars .t{height:6px;background:var(--surface);position:relative}
.bars .t i{position:absolute;left:0;top:0;bottom:0;background:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:10px 12px 10px 0;border-bottom:1px solid var(--fg)}
.tbl td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl select.in{font-size:13.5px;padding:4px 22px 4px 0;width:auto}
.scrollx{overflow-x:auto}
.ib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);border-top:1px solid var(--line);min-height:420px}
.ib .ls{border-right:1px solid var(--line)}
.ib .ls button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;width:100%;text-align:left;padding:16px 16px 16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ib .ls button:hover{background:var(--surface)}
.ib .ls button[aria-current="true"]{background:var(--surface)}
.ib .ls .u{width:6px;height:6px;border-radius:50%;background:var(--fg);align-self:center}
.ib .ls .u.r{background:transparent}
.ib .ls .nm{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib .ls .nm.unread{font-weight:400}
.ib .ls .sub{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib .dt{padding:28px 0 28px 32px;min-width:0}
.ib .dt .msg{white-space:pre-wrap;font-size:16px;line-height:1.7;margin-top:24px;max-width:60ch;overflow-wrap:anywhere}
@media (max-width:760px){.ib{grid-template-columns:1fr}.ib .ls{border-right:0}.ib .dt{padding:28px 0}}
.gate{max-width:560px;margin:0 auto;padding-block:clamp(72px,12vw,160px);text-align:left}
.gate h1{font-size:clamp(34px,4.6vw,56px);line-height:1.05;letter-spacing:-.02em;margin:18px 0 20px}
.gate p{color:#555;font-size:17px}
.skel{background:linear-gradient(90deg,var(--surface),var(--hover),var(--surface));background-size:200% 100%;animation:sk 1.4s linear infinite;min-height:16px}
@keyframes sk{to{background-position:-200% 0}}
.demo-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:70;background:var(--fg);color:#fff;
  display:flex;gap:18px;align-items:center;padding:10px 12px 10px 18px;font-size:12.5px;max-width:calc(100vw - 32px);white-space:nowrap}
.demo-bar a.btn{background:#fff;color:var(--fg);border-color:#fff;min-height:34px;padding:8px 14px}
@media (max-width:520px){.demo-bar span{display:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.pub{padding-left:0;padding-right:0}
body.pub .ss{padding-left:max(clamp(18px,4.5cqi,72px),env(safe-area-inset-left,0px));padding-right:max(clamp(18px,4.5cqi,72px),env(safe-area-inset-right,0px))}
/* ===== SORARY marketplace: gallery calm + analytics precision. Numbers in DM Mono, everything else Jost. ===== */
:root{--up:#3F5A45;--dn:#A3352A;--chart-fill:rgba(17,17,17,.045)}
.mono{font-family:var(--mono);font-weight:300;letter-spacing:-.01em}
i{font-style:italic}
.pnav{gap:30px}
.pnav .sep{width:1px;height:14px;background:var(--line)}
@media (max-width:1000px){.pnav{display:none}.menu-btn{display:block}}
.demo-t{display:inline-block;font-family:var(--sans);font-size:9px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:1px 6px 0;margin-left:8px;vertical-align:2px;font-weight:400;font-style:normal;line-height:1.6}
.dl{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.dl.up{color:var(--up)}.dl.dn{color:var(--dn)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sold);vertical-align:1px}
.sold{color:var(--dn);font-size:13px}

/* hero */
.mh-hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding-block:clamp(48px,8vw,112px) clamp(48px,6vw,88px);align-items:end}
.mh-hero .hx{grid-column:1/7;align-self:center}
.mh-hero h1{font-size:clamp(44px,6.6vw,104px);line-height:.98;letter-spacing:-.03em;margin-top:22px;max-width:9ch}
.mh-hero .sub{font-size:clamp(16px,1.4vw,19px);color:#444;max-width:44ch;margin-top:32px}
.hf{grid-column:8/13;margin:0}
.hf .im{display:flex;justify-content:center;background:var(--surface);padding:clamp(20px,3vw,44px)}
.hf img{max-height:min(66vh,640px);width:auto;height:auto;max-width:100%;object-fit:contain}
.hf figcaption{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:14px;font-size:13.5px;line-height:1.5}
.hf figcaption a{font-weight:400}
.mchip{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.mchip b{font-size:22px;font-weight:300}
@media (max-width:900px){.mh-hero .hx,.hf{grid-column:1/-1}}

/* ticker */
.ticker{display:flex;border-top:1px solid var(--fg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.ticker a{flex:1 0 auto;display:grid;grid-template-columns:auto auto auto;gap:2px 10px;align-items:baseline;padding:16px 22px 16px 0;margin-right:22px;border-right:1px solid var(--line);font-size:13.5px}
.ticker a .r{grid-row:1/3;color:var(--muted);font-size:12px}
.ticker a .n{grid-column:2/4;white-space:nowrap}
.ticker a .v{grid-column:2;grid-row:2;font-size:13px}
.ticker a .dl{grid-column:3;grid-row:2}
.ticker a.all{border-right:0;display:flex;align-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.ticker a:hover .n{text-decoration:underline;text-underline-offset:3px}

/* sections */
.sec2{padding-top:clamp(64px,8vw,120px)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,40px)}
.sh h2,.chead h2{font-size:clamp(24px,2.4vw,34px);letter-spacing:-.015em;line-height:1.15}
.sh p{margin-top:6px;font-size:14.5px}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.chead h2{font-size:18px;font-weight:400;letter-spacing:0}
.ph2{padding-block:clamp(48px,6vw,96px) clamp(24px,3vw,40px)}
.ph2 h1{font-size:clamp(36px,5vw,72px);line-height:1.02;letter-spacing:-.025em;margin-top:16px;max-width:16ch}
.split2{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.dtog{border:1px solid var(--line);padding:12px 14px}

/* artwork cards (masonry) */
.masonry{columns:4;column-gap:clamp(18px,2.4vw,36px)}
.masonry.c3{columns:3}
@media (max-width:1100px){.masonry{columns:3}}
@media (max-width:760px){.masonry,.masonry.c3{columns:2;column-gap:14px}}
.ac{break-inside:avoid;margin-bottom:clamp(32px,4vw,56px);position:relative}
.ac .im{display:flex;justify-content:center;align-items:center;background:var(--surface);padding:clamp(14px,1.8vw,26px)}
.ac .im img{width:100%;height:auto;transition:transform 1s var(--ease)}
.ac:hover .im img{transform:scale(1.015)}
.ac .cap{display:flex;flex-direction:column;gap:1px;margin-top:12px;font-size:13.5px;line-height:1.45}
.ac .an{font-weight:400}
.ac .ti{color:#333}
.ac .md{color:var(--muted);font-size:12.5px}
.ac .num{font-size:13px;margin-top:4px}
.ac .cap>span:last-child{margin-top:4px}
.savebtn{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.savebtn.ov{position:absolute;top:10px;right:10px;background:var(--bg);padding:7px 9px;opacity:0;transition:opacity .3s}
.savebtn.ov .l{display:none}
.ac:hover .savebtn.ov,.savebtn.ov:focus-visible,.savebtn.ov[aria-pressed="true"]{opacity:1}
.savebtn[aria-pressed="true"] svg path{fill:currentColor}
@media (hover:none){.savebtn.ov{opacity:1}}

/* artist cards */
.arcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,2.6vw,40px)}
@media (max-width:1000px){.arcs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.arcs{grid-template-columns:1fr}}
.arc{display:flex;flex-direction:column;gap:6px;min-width:0}
.arc .im{aspect-ratio:4/5;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:14%;overflow:hidden;margin-bottom:10px}
.arc .im img{max-height:100%;width:auto;height:auto;object-fit:contain;transition:transform 1s var(--ease)}
.arc:hover .im img{transform:scale(1.02)}
.arc .im .ini{font-size:56px;font-weight:200;color:var(--muted)}
.arc .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.arc .nm{font-size:17px;font-weight:400}
.arc .row2{font-size:13px}
.arc .row3{display:flex;align-items:center;gap:12px;font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.arc .spw{margin-left:auto;color:var(--fg)}
.textbtn.fol{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--fg);white-space:nowrap}
.textbtn.fol[aria-pressed="true"]{color:var(--muted)}
.btn.fol[aria-pressed="true"]{background:transparent;color:var(--fg)}
.btn.o.fol[aria-pressed="true"]{background:var(--surface)}

.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(32px,6vw,96px);align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.elist{border-top:1px solid var(--line)}
.elist a{display:grid;grid-template-columns:52px minmax(0,1fr) auto 64px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.elist a:hover{background:var(--surface)}
.elist .th{width:52px;height:52px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:6px}
.elist .th img{max-height:100%;width:auto;height:auto;object-fit:contain}
.elist .nm{display:flex;flex-direction:column;font-size:15px;min-width:0}
.elist .nm .muted{font-size:12.5px}
.elist .dl{text-align:right}
@media (max-width:480px){.elist a{grid-template-columns:44px minmax(0,1fr) 60px}.elist .spw{display:none}}
.forart{background:var(--surface);padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.forart h2{font-size:clamp(26px,2.6vw,36px);line-height:1.1;letter-spacing:-.015em}
.forart p{color:#555;max-width:40ch}

/* filters */
.fbar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:12.5px;padding:7px 14px;border:1px solid var(--line);color:#555;transition:border-color .2s,color .2s}
.chips button:hover{border-color:#bbb;color:var(--fg)}
.chips button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--fg);color:#fff}
.fr{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.fr select.in{font-size:13.5px;padding:6px 22px 6px 0;width:auto}

/* work detail */
.crumb{display:flex;gap:10px;font-size:12.5px;color:var(--muted);padding-top:28px}
.crumb a:hover{color:var(--fg)}
.wd{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(28px,5vw,88px);padding-top:28px;align-items:start}
.wd .stage{background:var(--surface);display:flex;justify-content:center;align-items:center;padding:clamp(24px,5vw,80px);cursor:zoom-in;min-height:300px}

async function prepareImage(file, maxFull = 2400, maxThumb = 900) {

/* ---------- line chart with hover ---------- */
const CHARTS = new Map();
function lineChart(host, o) {
  CHARTS.set(host, o);
  const draw = () => {
    const W = Math.max(260, host.clientWidth), H = o.height || 220, m = { l: 44, r: 14, t: 14, b: 26 };
    const vals = o.values, n = vals.length, days = o.days;
    let max = Math.max(...vals, 1); const mag = Math.pow(10, Math.floor(Math.log10(max))); max = Math.ceil(max / (mag / 2)) * (mag / 2);
    const x = i => m.l + i / (n - 1) * (W - m.l - m.r), y = v => m.t + (1 - v / max) * (H - m.t - m.b);
    const fmt = o.fmt || (v => fmtN(v));
    const line = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
    const area = line + `L${x(n - 1).toFixed(1)} ${y(0)}L${x(0).toFixed(1)} ${y(0)}Z`;
    const grid = [0, .5, 1].map(f => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(max * f)}" y2="${y(max * f)}" class="gl"/><text x="${m.l - 8}" y="${y(max * f) + 4}" text-anchor="end" class="tk">${fmt(max * f)}</text>`).join("");
    const ticks = []; days.forEach((t, i) => { const d = new Date(t); if (d.getDate() === 1 && i > 3 && i < n - 4) ticks.push(`<line x1="${x(i)}" x2="${x(i)}" y1="${y(0)}" y2="${y(0) + 4}" class="gl"/><text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="tk">${d.toLocaleDateString("en-GB", { month: "short" })}</text>`); });
    const ex = x(n - 1), ey = y(vals[n - 1]);
    host.innerHTML = `<div class="chw"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label || "Chart")}: latest ${fmt(vals[n - 1])}">${grid}${ticks.join("")}
      <path d="${area}" class="ar"/><path d="${line}" class="ln"/><circle cx="${ex}" cy="${ey}" r="3.5" class="ed"/>
      <g class="hv" style="opacity:0"><line class="hl" y1="${m.t}" y2="${y(0)}"/><circle r="4" class="hd"/></g><rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div></div>`;
    const svg = $("svg", host), hv = $(".hv", host), tip = $(".tip", host);
    const at = ev => { const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width; const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (W - m.l - m.r) * (n - 1))));
      $("line", hv).setAttribute("x1", x(i)); $("line", hv).setAttribute("x2", x(i)); $("circle", hv).setAttribute("cx", x(i)); $("circle", hv).setAttribute("cy", y(vals[i])); hv.style.opacity = 1;
      tip.hidden = false; tip.innerHTML = `<span>${fmtDate(days[i])}</span><b>${fmt(vals[i])}</b>${o.unit ? ` <span>${esc(o.unit)}</span>` : ""}`;
      const tx = x(i) * r.width / W; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, tx - tip.offsetWidth / 2)) + "px"; };
    const hitR = $(".hit", host); hitR.onpointermove = at; hitR.onpointerdown = at; hitR.onpointerleave = () => { hv.style.opacity = 0; tip.hidden = true; };
  };
  draw();
  if (!host._ro && window.ResizeObserver) { let lw = host.clientWidth; host._ro = new ResizeObserver(() => { if (Math.abs(host.clientWidth - lw) > 4) { lw = host.clientWidth; draw(); } }); host._ro.observe(host); }
}

function filteredWorks() {

  if (f.avail) L = L.filter(x => x.w.availability === "available");

  if (f.color) L = L.filter(x => (workColors(x.w) || []).includes(f.color));
  const pr = { any: [0, 1e12], u15: [0, 15000], m: [15000, 40000], o40: [40000, 1e12] }[f.price];

  if (f.sort === "curated") L.sort((p, q) => (mom(q.a) + (q.w.availability === "available" ? 20 : 0) + (isLifted(q.w) ? 1000 : 0)) - (mom(p.a) + (p.w.availability === "available" ? 20 : 0) + (isLifted(p.w) ? 1000 : 0)));

/* ============ router ============ */
function route(soft) {
  const h = curHash();
  if (!soft) { $$(".ov,.drawer,.scrim,.mmenu").forEach(e => e.remove()); document.title = "SORARY — Original contemporary art"; }
  const y = window.scrollY;
  const P = { sell: pageSell, protection: pageProtection, home: pageHome, art: pageArt, artists: pageArtists, momentum: pageMomentum, following: pageFollowing, about: pageAbout, studio: pageStudio, "studio-works": pageSWorks, "studio-profile": pageSProfile, "studio-inbox": pageSInbox };
  if (soft && /^studio-(works|profile)$/.test(h)) return;
  if (P[h]) P[h]();
  else if (h === "privacy" || h === "terms") pageLegal(h);
  else if (h.startsWith("a--")) pageArtist(h.slice(3));
  else if (h.startsWith("w--")) { const [s, w] = h.slice(3).split("--"); pageWork(s, w); }
  else pageHome();
  if (soft) window.scrollTo(0, y); else if (!h.startsWith("w--") && !h.startsWith("a--")) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => route());
document.addEventListener("click", e => {
  if (e.target.closest("[data-mmenu]")) return openMobileMenu();
  if (e.target.closest("[data-copymail]")) { navigator.clipboard.writeText("sorary.support@gmail.com").then(() => toast("Copied sorary.support@gmail.com"), () => toast("Select the address to copy it")); return; }
  const t = e.target.closest("[data-fcolor],[data-fstyle],[data-fsubject]"); if (t) { Object.assign(S.filters, { cat: "All", style: "all", subject: "all", color: null }); if (t.dataset.fcolor) S.filters.color = t.dataset.fcolor; if (t.dataset.fstyle) S.filters.style = t.dataset.fstyle; if (t.dataset.fsubject) S.filters.subject = t.dataset.fsubject; }
  const f = e.target.closest("[data-follow]"); if (f) { e.preventDefault(); toggleFollow(f.dataset.follow); return; }
  const s = e.target.closest("[data-save]"); if (s) { e.preventDefault(); toggleSave(s.dataset.save); return; }
});
